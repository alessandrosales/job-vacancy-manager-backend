---
openapi: 3.0.1
info:
  title: Job Vacancy Manager API
  version: 1.0.0
  description: 'REST API under `/api/v1`. JSON keys use snake_case. Primary keys are
    UUIDs. Protected routes expect `Authorization: Bearer <jwt>`.'
paths:
  "/api/v1/auth/login":
    post:
      summary: Issues JWT
      tags:
      - Auth
      parameters: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/auth_login_response"
        '401':
          description: invalid credentials
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/auth_login_request"
  "/api/v1/users":
    get:
      summary: Lists the current user
      tags:
      - Users
      security:
      - bearer_auth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/users_list"
        '401':
          description: missing or invalid JWT
    post:
      summary: Registers user (public)
      tags:
      - Users
      parameters: []
      responses:
        '201':
          description: created
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/user"
        '422':
          description: validation errors
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/validation_errors"
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/user_create_request"
  "/api/v1/users/{id}":
    parameters:
    - name: id
      in: path
      format: uuid
      description: User UUID
      required: true
      schema:
        type: string
    get:
      summary: Fetches user by id
      tags:
      - Users
      security:
      - bearer_auth: []
      responses:
        '200':
          description: found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/user"
        '404':
          description: not found
    patch:
      summary: Updates user
      tags:
      - Users
      security:
      - bearer_auth: []
      parameters: []
      responses:
        '200':
          description: updated
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/user"
        '422':
          description: validation errors
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/validation_errors"
        '404':
          description: not found
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/user_update_request"
    delete:
      summary: Deletes user
      tags:
      - Users
      security:
      - bearer_auth: []
      responses:
        '204':
          description: no content
        '404':
          description: not found
servers:
- url: http://localhost:3000
  description: Development
components:
  securitySchemes:
    bearer_auth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    user:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
      - id
      - name
      - email
      - created_at
      - updated_at
    users_list:
      type: array
      items:
        "$ref": "#/components/schemas/user"
    user_create_request:
      type: object
      properties:
        user:
          type: object
          properties:
            name:
              type: string
            email:
              type: string
              format: email
            password:
              type: string
              minLength: 8
              writeOnly: true
            password_confirmation:
              type: string
              minLength: 8
              writeOnly: true
          required:
          - name
          - email
          - password
          - password_confirmation
      required:
      - user
    user_update_request:
      type: object
      properties:
        user:
          type: object
          properties:
            name:
              type: string
            email:
              type: string
              format: email
            password:
              type: string
              minLength: 8
              writeOnly: true
            password_confirmation:
              type: string
              minLength: 8
              writeOnly: true
      required:
      - user
    auth_login_request:
      type: object
      properties:
        auth:
          type: object
          properties:
            email:
              type: string
              format: email
            password:
              type: string
              writeOnly: true
          required:
          - email
          - password
      required:
      - auth
    auth_login_response:
      type: object
      properties:
        token:
          type: string
          description: HS256 JWT
        user:
          "$ref": "#/components/schemas/user"
      required:
      - token
      - user
    validation_errors:
      type: object
      properties:
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
