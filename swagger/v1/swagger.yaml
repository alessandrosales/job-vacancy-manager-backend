---
openapi: 3.0.1
info:
  title: Job Vacancy Manager API
  version: 1.0.0
  description: 'REST API under `/api/v1`. JSON keys use snake_case. Primary keys are
    UUIDs. Protected routes expect `Authorization: Bearer <jwt>`.'
paths:
  "/api/v1/auth/recover_password":
    post:
      summary: Sends reset e-mail if account exists (always 204)
      tags:
      - Auth
      parameters: []
      responses:
        '204':
          description: no content (same when email unknown — no enumeration)
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/auth_recover_password_request"
  "/api/v1/auth/change_password":
    post:
      summary: Sets new password using reset token; returns JWT
      tags:
      - Auth
      parameters: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/auth_login_response"
        '422':
          description: invalid token, expired token, or password validation
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/validation_errors"
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/auth_change_password_request"
  "/api/v1/auth/register":
