---
openapi: 3.0.1
info:
  title: Job Vacancy Manager API
  version: 1.0.0
  description: API REST versionada em `/api/v1`. Chaves primárias e estrangeiras em
    UUID.
paths:
  "/api/v1/users":
    get:
      summary: Lista usuários
      tags:
      - Users
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/users_list"
    post:
      summary: Cadastra usuário
      tags:
      - Users
      parameters: []
      responses:
        '201':
          description: criado
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/user"
        '422':
          description: erros de validação
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/validation_errors"
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/user_create_request"
  "/api/v1/users/{id}":
    parameters:
    - name: id
      in: path
      format: uuid
      description: UUID do usuário
      required: true
      schema:
        type: string
    get:
      summary: Busca usuário por id
      tags:
      - Users
      responses:
        '200':
          description: encontrado
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/user"
        '404':
          description: não encontrado
    patch:
      summary: Atualiza usuário
      tags:
      - Users
      parameters: []
      responses:
        '200':
          description: atualizado
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/user"
        '422':
          description: erros de validação
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/validation_errors"
        '404':
          description: não encontrado
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/user_update_request"
    delete:
      summary: Remove usuário
      tags:
      - Users
      responses:
        '204':
          description: sem conteúdo
        '404':
          description: não encontrado
servers:
- url: http://localhost:3000
  description: Desenvolvimento
components:
  schemas:
    user:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
      - id
      - name
      - email
      - created_at
      - updated_at
    users_list:
      type: array
      items:
        "$ref": "#/components/schemas/user"
    user_create_request:
      type: object
      properties:
        user:
          type: object
          properties:
            name:
              type: string
            email:
              type: string
              format: email
            password:
              type: string
              minLength: 8
              writeOnly: true
            password_confirmation:
              type: string
              minLength: 8
              writeOnly: true
          required:
          - name
          - email
          - password
          - password_confirmation
      required:
      - user
    user_update_request:
      type: object
      properties:
        user:
          type: object
          properties:
            name:
              type: string
            email:
              type: string
              format: email
            password:
              type: string
              minLength: 8
              writeOnly: true
            password_confirmation:
              type: string
              minLength: 8
              writeOnly: true
      required:
      - user
    validation_errors:
      type: object
      properties:
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
