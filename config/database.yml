# PostgreSQL via variáveis de ambiente (ver `.env.example`).
# Em desenvolvimento/teste, nomes de banco padrão são usados quando `DATABASE_NAME` está vazio.

default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV["DATABASE_HOST"].presence || "localhost" %>
  port: <%= ENV["DATABASE_PORT"].presence || "5432" %>
  username: <%= ENV["DATABASE_USERNAME"].presence || ENV.fetch("USER", "postgres") %>
  password: <%= ENV["DATABASE_PASSWORD"] %>

development:
  <<: *default
  database: <%= ENV["DATABASE_NAME"].presence || "job_vacancy_manager_development" %>

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: <%= ENV["DATABASE_NAME"].presence || "job_vacancy_manager_test" %>

<% prod_db = ENV["DATABASE_NAME"].presence || "job_vacancy_manager_production" %>
production:
  primary:
    <<: *default
    database: <%= prod_db %>
  cache:
    <<: *default
    database: <%= ENV["DATABASE_CACHE_NAME"].presence || "#{prod_db}_cache" %>
    migrations_paths: db/cache_migrate
  queue:
    <<: *default
    database: <%= ENV["DATABASE_QUEUE_NAME"].presence || "#{prod_db}_queue" %>
    migrations_paths: db/queue_migrate
  cable:
    <<: *default
    database: <%= ENV["DATABASE_CABLE_NAME"].presence || "#{prod_db}_cable" %>
    migrations_paths: db/cable_migrate
