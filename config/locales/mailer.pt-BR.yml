---
"pt-BR":
  mailer:
    signature: |-
      Atenciosamente,
      Hireest
  password_mailer:
    reset_instructions:
      subject: "Redefinir sua senha — Hireest"
      greeting: "Olá, %{name},"
      intro: "Recebemos um pedido para redefinir sua senha. Abra o link abaixo para escolher uma nova senha:"
      expiry: "Este link expira em breve. Se você não solicitou a redefinição de senha, pode ignorar este e-mail com segurança."
    password_changed:
      subject: "Sua senha foi alterada — Hireest"
      greeting: "Olá, %{name},"
      intro: "Esta é uma confirmação de que a senha da sua conta Hireest (%{email}) acabou de ser alterada."
      if_you: "Se foi você quem fez essa alteração, pode ignorar esta mensagem."
      if_not: "Se você não alterou a senha, proteja sua conta agora: use \"Esqueci a senha\" na página de entrar ou fale com o suporte."
  registration_mailer:
    welcome:
      subject: "Bem-vindo ao Hireest"
      greeting: "Olá, %{name},"
      intro: "Obrigado por criar sua conta no Hireest. Tudo pronto."
      signin: "Você pode entrar quando quiser com seu e-mail e a senha que escolheu."
      if_not: "Se você não criou esta conta, ignore esta mensagem."
