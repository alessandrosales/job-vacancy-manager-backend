# Continuous integration: lint, security scans, autoload check, and RSpec.
# CI overview: https://docs.github.com/en/actions/get-started/continuous-integration
# Workflow syntax: https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax
# PostgreSQL service: https://docs.github.com/en/actions/using-containerized-services/creating-postgresql-service-containers

name: CI

# Apenas push em main/master (merge na branch integra código e dispara uma execução; sem pull_request evita CI duplicado no PR + no merge).
on:
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Code quality
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      RAILS_ENV: test
      DATABASE_HOST: localhost
      DATABASE_PORT: "5432"
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install packages (libvips)
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libvips

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Prepare RuboCop cache
        uses: actions/cache@v4
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('.ruby-version', '**/.rubocop.yml', '**/.rubocop_todo.yml', 'Gemfile.lock') }}
        with:
          path: tmp/rubocop
          key: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-

      - name: Zeitwerk autoloading check
        run: bin/rails zeitwerk:check

      - name: Lint (RuboCop)
        env:
          RUBOCOP_CACHE_ROOT: tmp/rubocop
        run: bin/rubocop -f github

      - name: Security — gem audit (bundler-audit)
        run: bin/bundler-audit

      - name: Security — Brakeman
        run: bin/brakeman --no-pager

      - name: Prepare test database
        run: bin/rails db:test:prepare

      - name: Run RSpec
        run: bundle exec rspec
