# Deploy na VPS: SSH, git pull nos dois repositórios e docker compose --build.
#
# Pré-requisitos na VPS:
# - Mesmo layout de pastas que o compose espera (FRONTEND_BUILD_CONTEXT no .env.docker apontando para o clone do frontend).
# - Usuário SSH no grupo `docker` (ou sudo sem senha para docker, se você adaptar os comandos).
# - Git nos dois diretórios já configurado com remote e credencial (deploy key ou HTTPS).
#
# GitHub → Settings → Secrets and variables → Actions
#   Secrets:  VPS_HOST, VPS_USER, VPS_SSH_PRIVATE_KEY
#   Variables: VPS_BACKEND_PATH, VPS_FRONTEND_PATH (caminhos absolutos na VPS)
#
# Referência: https://docs.github.com/en/actions/security-guides/using-secrets-in-github-actions

name: Deploy VPS

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to deploy (both repos)
        required: true
        default: master
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    name: SSH pull & docker compose
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      BACKEND_PATH: ${{ vars.VPS_BACKEND_PATH }}
      FRONTEND_PATH: ${{ vars.VPS_FRONTEND_PATH }}
      DEPLOY_BRANCH: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.branch || github.ref_name }}

    steps:
      - name: Validate configuration
        run: |
          if [ -z "${BACKEND_PATH}" ] || [ -z "${FRONTEND_PATH}" ]; then
            echo "Configure repository Variables: VPS_BACKEND_PATH and VPS_FRONTEND_PATH (absolute paths on the VPS)."
            exit 1
          fi

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          command_timeout: 45m
          envs: BACKEND_PATH,FRONTEND_PATH,DEPLOY_BRANCH
          script: |
            set -euo pipefail
            cd "$FRONTEND_PATH"
            git fetch origin
            git checkout "$DEPLOY_BRANCH"
            git pull --ff-only origin "$DEPLOY_BRANCH"
            cd "$BACKEND_PATH"
            git fetch origin
            git checkout "$DEPLOY_BRANCH"
            git pull --ff-only origin "$DEPLOY_BRANCH"
            docker compose --env-file .env.docker up -d --build
