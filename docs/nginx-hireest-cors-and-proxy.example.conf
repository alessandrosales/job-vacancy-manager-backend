# Exemplos para aaPanel / Nginx quando o browser mostra:
# "No 'Access-Control-Allow-Origin' header" no *preflight* (OPTIONS).
#
# O Rails (Rack::Cors) só ajuda se o OPTIONS chegar ao Puma. Muitos proxies do painel
# não repassam OPTIONS ou respondem erro sem headers CORS — daí o erro persistir.
#
# ----------------------------------------------------------------------------
# OPÇÃO A — Subdomínio api.* : tratar OPTIONS no Nginx + proxy para o Docker
#
# Coloque no servidor `api.hireest.com` (ajuste a porta do backend no host).
# No aaPanel: Website → api.hireest.com → Configuração → arquivo de configuração /
# "Reverse proxy" → campo de configuração avançada (conforme o tema).
#
# Substitua 8291 pela porta publicada do container backend (BACKEND_PORT).
# ----------------------------------------------------------------------------

# Dentro do location que faz proxy para o Rails (geralmente location /):

if ($request_method = OPTIONS) {
    add_header Access-Control-Allow-Origin "https://hireest.com" always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept, X-Requested-With" always;
    add_header Access-Control-Max-Age 86400 always;
    add_header Content-Length 0 always;
    return 204;
}

proxy_pass http://127.0.0.1:8291;
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# Se usar também https://www.hireest.com no front, duplique a origem ou use um map no bloco http {}

