# API Rails + frontend (React Router). PostgreSQL é externo (configure DATABASE_* no .env.docker).
# Pré-requisito: repositório do frontend (FRONTEND_BUILD_CONTEXT).
#
# Uso:
#   cp .env.docker.example .env.docker
#   docker compose --env-file .env.docker up --build
#
# Postgres no mesmo servidor que o Docker (Linux): DATABASE_HOST=host.docker.internal
# e o serviço backend usa extra_hosts abaixo. Se o banco está em outra máquina, use o hostname/IP dela.
#
# Frontend e backend sobem em paralelo (sem depends_on): se o Rails falhar, o site em :5173 ainda sobe para você não ficar sem proxy.
#
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      RAILS_ENV: production
      DATABASE_HOST: ${DATABASE_HOST:-host.docker.internal}
      DATABASE_PORT: ${DATABASE_PORT:-5432}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-postgres}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-}
      DATABASE_NAME: ${DATABASE_NAME:-job_vacancy_manager_production}
      RAILS_MASTER_KEY: ${RAILS_MASTER_KEY:?defina RAILS_MASTER_KEY no .env.docker}
      RAILS_LOG_LEVEL: ${RAILS_LOG_LEVEL:-info}
      PORT: "3000"
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      # Remetente: prefer SMTP_DEFAULT_FROM; MAILER_DEFAULT_FROM permanece para compat.
      SMTP_DEFAULT_FROM: ${SMTP_DEFAULT_FROM:-}
      MAILER_DEFAULT_FROM: ${MAILER_DEFAULT_FROM:-}
      # Legado (opcional): sobrescreve FRONTEND_URL nas URLs internas do Action Mailer.
      MAILER_DEFAULT_URL_HOST: ${MAILER_DEFAULT_URL_HOST:-}
      MAILER_DEFAULT_URL_PORT: ${MAILER_DEFAULT_URL_PORT:-}
      MAILER_DEFAULT_URL_PROTOCOL: ${MAILER_DEFAULT_URL_PROTOCOL:-}
      # Repasse explícito: variáveis do --env-file .env.docker não entram no container se não aparecerem aqui.
      SMTP_ADDRESS: ${SMTP_ADDRESS:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_DOMAIN: ${SMTP_DOMAIN:-}
      SMTP_USER_NAME: ${SMTP_USER_NAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_AUTHENTICATION: ${SMTP_AUTHENTICATION:-plain}
      SMTP_ENABLE_STARTTLS_AUTO: ${SMTP_ENABLE_STARTTLS_AUTO:-true}
      SMTP_SSL: ${SMTP_SSL:-false}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      SKIP_DB_PREPARE: ${SKIP_DB_PREPARE:-false}
    volumes:
      - backend_storage:/rails/storage
    command: ["./bin/rails", "server", "-b", "0.0.0.0", "-p", "3000"]

  frontend:
    build:
      context: ${FRONTEND_BUILD_CONTEXT:-../job-vacancy-manager-layout}
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3000}
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:?defina VITE_FIREBASE_API_KEY no .env.docker}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN:?defina VITE_FIREBASE_AUTH_DOMAIN no .env.docker}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID:?defina VITE_FIREBASE_PROJECT_ID no .env.docker}
        VITE_FIREBASE_STORAGE_BUCKET: ${VITE_FIREBASE_STORAGE_BUCKET:?defina VITE_FIREBASE_STORAGE_BUCKET no .env.docker}
        VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID:?defina VITE_FIREBASE_MESSAGING_SENDER_ID no .env.docker}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID:?defina VITE_FIREBASE_APP_ID no .env.docker}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    environment:
      NODE_ENV: production
      PORT: "5173"
      HOST: "0.0.0.0"

volumes:
  backend_storage:
